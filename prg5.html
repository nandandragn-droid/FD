<!DOCTYPE html>
<html>
<head>
<title>Student Data</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<h2>Student Dashboard</h2>
<button onclick="loadData()">Load Data</button>
<p id="msg"></p>

<table border="1">
<tr>
<th>Name</th><th>Class</th><th>College</th><th>Marks</th>
</tr>
<tbody id="data"></tbody>
</table>

<script>
function loadData() {
document.getElementById("msg").innerHTML = "Loading...";

fetch("https://raw.githubusercontent.com/vegapunk-hub/json_data/main/raw.json")
.then(response => {
if (!response.ok) throw new Error("Failed to load");
return response.json();
})
.then(result => {
result.students.forEach(s => {
document.getElementById("data").innerHTML += `
<tr>
<td>${s.name}</td>
<td>${s.class}</td>
<td>${s.college}</td>
<td>${s.totalMarks}</td>
</tr>`;
});
document.getElementById("msg").innerHTML = "Data loaded!";
})
.catch(error => {
document.getElementById("msg").innerHTML = "Error loading data!";
});
}
</script>
</body>
</html>
